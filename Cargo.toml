# =============================================================================
#  R E P S   ·   macro-lang
# =============================================================================
[package]
name    = "macro-lang"
version = "0.2.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Hygienic macro expansion: pattern match + template substitution."

# Keywords (5 max)
keywords = ["compiler", "language", "macros", "hygiene", "expansion"]

# Categories
categories = ["development-tools", "compilers"]

# Links
homepage      = "https://github.com/jamesgober/macro-lang"
repository    = "https://github.com/jamesgober/macro-lang"
documentation = "https://docs.rs/macro-lang"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "macro_lang"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["std"]
# The standard library. Without it the crate is `no_std` and needs only `alloc`.
std = ["token-lang/std", "intern-lang/std"]


# DEPENDENCIES
# #################################
[dependencies]
# The leaves of every token tree: a language's token kind paired with its source
# span. Also supplies the `Span` re-export, so the span type always matches the
# one tokens carry.
token-lang = { version = "1", default-features = false }
# Interned names: macro names and metavariable names are cheap `Symbol` handles.
intern-lang = { version = "1", default-features = false }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"


# BENCHMARKS
# #################################
[[bench]]
name    = "bench"
harness = false


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
